name: smart-ev-journey

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker/reset-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: smart_ev_data
      POSTGRES_USER: smart_ev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_ev}
      RESET_ON_START: ${RESET_ON_START:-1}
      HISTORY_REQUIRED: "1"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - smart_ev_postgres_data:/var/lib/postgresql/data
      - ./database/docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./database/docker:/docker:ro
      - ./database:/db:ro
      # CSV occupancy tháng 9-10/2026, nạp nguyên một lần lúc initdb (COPY của load_history.sql
      # chạy phía server nên cần đường dẫn /sim trong container postgres).
      - ./database/fixtures/simulator:/sim:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smart_ev -d smart_ev_data"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 180s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://smart_ev:${POSTGRES_PASSWORD:-smart_ev}@postgres:5432/smart_ev_data
      CATALOG_STORAGE: database
      DATA_DIR: /app/database/fixtures
      MODEL_DIR: /app/ml/model
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-smart-ev-dev-internal-key}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      STATION_STATUS_STALE_AFTER_S: "900"
      # Giờ demo ban đầu (giờ VN, rỗng = giờ thật). Frontend đổi được lúc chạy.
      DEMO_NOW: ${DEMO_NOW:-}
      DEMO_CLOCK_WRITABLE: ${DEMO_CLOCK_WRITABLE:-true}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  smart_ev_postgres_data:
