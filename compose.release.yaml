services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_ev_data
      POSTGRES_USER: smart_ev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.release}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_ev -d smart_ev_data"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - smart_ev_release_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.release}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "6379"

  migrate:
    image: smart-ev-backend:release
    working_dir: /app/data_platform
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    env_file:
      - .env.release
    environment:
      DATABASE_URL: postgresql+psycopg://smart_ev:${POSTGRES_PASSWORD}@postgres:5432/smart_ev_data
    command: ["python", "-m", "alembic", "-c", "/app/data_platform/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: smart-ev-backend:release
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env.release
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.250.2}
      DATABASE_URL: postgresql+psycopg://smart_ev:${POSTGRES_PASSWORD}@postgres:5432/smart_ev_data
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      CATALOG_STORAGE: database
      PLANNED_ARRIVALS_STORAGE: database
      REALTIME_TELEMETRY_STORAGE: database
      JOURNEY_STORAGE: database
      OCCUPANCY_HISTORY_STORAGE: database
      DATA_DIR: /app/data
      MODEL_ARTIFACT_PATH: /app/ml/artifacts/occupancy_model.joblib
      MODEL_PREPROCESSOR_PATH: /app/ml/artifacts/occupancy_preprocessor.joblib
      MODEL_META_PATH: /app/ml/artifacts/occupancy_model_meta.json
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in .env.release}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE in .env.release}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?set OIDC_JWKS_URL in .env.release}
      OSRM_BASE_URL: ${OSRM_BASE_URL:?set OSRM_BASE_URL in .env.release}
      REALTIME_TELEMETRY_MAX_FUTURE_SKEW_S: ${REALTIME_TELEMETRY_MAX_FUTURE_SKEW_S:-60}
      CATALOG_SOURCE_MAX_AGE_S: ${CATALOG_SOURCE_MAX_AGE_S:?set the approved CATALOG_SOURCE_MAX_AGE_S in .env.release}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  observation-retention:
    image: smart-ev-backend:release
    restart: unless-stopped
    env_file:
      - .env.release
    environment:
      DATA_PLATFORM_DATABASE_URL: postgresql+psycopg://smart_ev:${POSTGRES_PASSWORD}@postgres:5432/smart_ev_data
      OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:?set the approved OBSERVATION_RETENTION_DAYS in .env.release}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          sleep 86400;
          python /app/data_platform/scripts/prune_observation_history.py
          --older-than-days "$${OBSERVATION_RETENTION_DAYS}" --apply;
        done
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:?set OIDC_ISSUER in .env.release}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env.release}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email offline_access}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: ${RELEASE_WEB_PROXY_IP:-172.31.250.2}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${RELEASE_WEB_HOST_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - smart_ev_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/smart-ev-release.json
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - smart_ev_grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - smart_ev_alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    expose:
      - "9093"

volumes:
  smart_ev_release_postgres_data:
  smart_ev_prometheus_data:
  smart_ev_alertmanager_data:
  smart_ev_grafana_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${RELEASE_DOCKER_SUBNET:-172.31.250.0/24}
          ip_range: ${RELEASE_DOCKER_IP_RANGE:-172.31.250.128/25}

secrets:
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:?set ALERTMANAGER_WEBHOOK_URL_FILE in .env.release}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?set GRAFANA_ADMIN_PASSWORD_FILE in .env.release}
