services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smart_ev_data
      POSTGRES_USER: smart_ev
      POSTGRES_PASSWORD: smart_ev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_ev -d smart_ev_data"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - smart_ev_data_platform_postgres:/var/lib/postgresql/data

volumes:
  smart_ev_data_platform_postgres:
