server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bundle nhúng VITE_* lúc build: index.html phải luôn được kiểm tra lại để không trỏ tới bundle cũ.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # File trong assets/ có hash trong tên nên cache lâu được.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
