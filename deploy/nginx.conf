server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/metrics {
        return 404;
    }

    location = /api/health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health/live {
        proxy_pass http://api:8000/health/live;
        proxy_set_header Host $host;
    }

    location = /_api_ready {
        internal;
        proxy_pass http://api:8000/health/ready;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # auth_request treats a readiness 503 as an internal error unless mapped here.
    error_page 500 =503 @api_readiness_unavailable;

    location @api_readiness_unavailable {
        default_type application/json;
        return 503 '{"detail":"API is not ready","error_code":"DEPENDENCY_UNAVAILABLE"}';
    }

    # Permit the authenticated telemetry adapter to establish initial live status
    # while readiness is false; other APIs remain gated below.
    location ~ ^/api/realtime/stations/[^/]+/telemetry$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        auth_request /_api_ready;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
